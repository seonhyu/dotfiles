# Tokyo Night 테마 - tmux 상태 표시줄 및 스타일링
set -g @plugin 'janoamaral/tokyo-night-tmux'
# Tmux Plugin Manager - 플러그인 관리 도구
set -g @plugin 'tmux-plugins/tpm'
# 합리적인 기본 설정 모음 - 자주 사용하는 옵션들을 자동 설정
set -g @plugin 'tmux-plugins/tmux-sensible'
# Neovim과 tmux 간 원활한 통합 - 창 이동 및 탐색 개선
set -g @plugin 'aserowy/tmux.nvim'
# 세션 저장 및 복원 - 재부팅 후에도 세션 복구 가능
set -g @plugin 'tmux-plugins/tmux-resurrect'
# 자동 세션 저장 - resurrect와 함께 사용하여 주기적으로 세션 자동 저장
set -g @plugin 'tmux-plugins/tmux-continuum'

unbind-key C-b
set -g prefix C-f

# Enable mouse
set -g mouse on

# Disable focus-events to prevent escape sequences in input
set -g focus-events off

# Increase history limit
set -g history-limit 50000

#=================================================================
# UI
#=================================================================

# Terminal and color support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"  # truecolor 지원
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'  # clipboard support
set -as terminal-overrides ',*:Sync=\E]2026;%p1%d\007'  # synchronized updates
# Disable focus events to prevent [I[O escape sequences in Claude Code vim mode
# Without this, focus in/out events are sent as escape sequences that appear as text input
set -as terminal-overrides ',*:focus@'

# Start windows and panes at 1 and not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Setup tmux theme
set -g @tokyo-night-tmux_window_id_style fsquare
set -g @tokyo-night-tmux_pane_id_style super
set -g @tokyo-night-tmux_zoom_id_style dsquare


#=================================================================
# status bar
#=================================================================
# Toggle tmux status bar
set -g status on
bind '\' set status

# Zero-out escape time delay for quicker response
set -s escape-time 0

# VI modes
# Use vi keybindings for tmux commandline input.
set -g status-keys vi
# Use vi keybindings in copy and choice modes
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"

# keybindings
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# resizing
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|claude)(diff)?$'"

# Disabled to prevent conflicts with Claude Code and other tools
# bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 1'
# bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 1'
# bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 1'
# bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 1'

# Use prefix + H/J/K/L for resizing instead
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -T copy-mode-vi M-h resize-pane -L 1
bind-key -T copy-mode-vi M-j resize-pane -D 1
bind-key -T copy-mode-vi M-k resize-pane -U 1
bind-key -T copy-mode-vi M-l resize-pane -R 1

# Open the new panes in the current path
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind 'C-f' last-window

# pane간 동시 입력
bind-key a setw synchronize-panes \; display-message "synchronize-panes: #{?pane_synchronized,on,off}"


# ============================================
# TPM start
# ============================================

# If this is your first time using tmux, you will need to press (prefix) + I to fetch the plugins.
run '~/.config/tmux/plugins/tpm/tpm'


# ============================================
# Session 기반 Workflow 최적화 설정
# ============================================

# set -g @sessionx-bind 's'

bind s choose-tree -sZ

# 새 Session 생성 (프로젝트명 입력)
bind S command-prompt -p "New session:" "new-session -s '%%'"

# 세션 kill 시 다른 세션으로 자동 전환 (detach 방지)
set-option -g detach-on-destroy off

# Session 간 빠른 전환 (세션 목록 순서)
bind -n M-0 switch-client -t scratch
bind -n M-1 run-shell "tmux switch-client -t $(tmux list-sessions -F '##{session_name}' | sed -n '1p')"
bind -n M-2 run-shell "tmux switch-client -t $(tmux list-sessions -F '##{session_name}' | sed -n '2p')"
bind -n M-3 run-shell "tmux switch-client -t $(tmux list-sessions -F '##{session_name}' | sed -n '3p')"
bind -n M-4 run-shell "tmux switch-client -t $(tmux list-sessions -F '##{session_name}' | sed -n '4p')"
bind -n M-5 run-shell "tmux switch-client -t $(tmux list-sessions -F '##{session_name}' | sed -n '5p')"

# ── Window 관리 ──
# Window 생성 시 현재 경로 유지
bind c new-window -c "#{pane_current_path}"

# ── 상태바 ──
set -g status-position top
# window 상태 표시 단순하게
setw -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#73daca,bg=#1A1B26] #I:#W "

# ── Pane 모양 ──
set -g pane-border-style "fg=#636363"
set -g pane-active-border-style "fg=#73daca,bold"

# Pane border indicators
set -g pane-border-lines heavy

# Active pane 강조 (catppuccin-macchiato bg: #24273a)
set -g window-active-style 'bg=#24273a'
set -g window-style 'bg=default'
